<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barcode Inserter</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #fff;
      color: #323130;
      padding: 16px;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #106ebe; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; margin-top: 12px; }
    select, input[type="text"], input[type="number"] {
      width: 100%; padding: 6px 8px; border: 1px solid #c8c6c4;
      border-radius: 2px; font-size: 13px; outline: none;
    }
    select:focus, input:focus { border-color: #106ebe; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      margin-top: 16px; width: 100%; padding: 8px;
      background: #106ebe; color: #fff; border: none;
      border-radius: 2px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #005a9e; }
    button:disabled { background: #a19f9d; cursor: default; }
    #status {
      margin-top: 12px; font-size: 12px; padding: 8px;
      border-radius: 2px; display: none;
    }
    #status.ok    { background: #dff6dd; color: #107c10; display: block; }
    #status.error { background: #fde7e9; color: #a4262c; display: block; }
    #preview {
      margin-top: 14px; text-align: center; min-height: 80px;
      border: 1px dashed #c8c6c4; border-radius: 2px; padding: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    #preview img { max-width: 100%; max-height: 160px; }
    #preview span { color: #a19f9d; font-size: 11px; }
    .hint { font-size: 11px; color: #605e5c; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>&#9641; Barcode Inserter</h1>

  <label for="barcodeValue">Value</label>
  <input type="text" id="barcodeValue" placeholder="e.g. 012345678901"/>
  <p class="hint" id="valueHint">12 digits for EAN-13</p>

  <label for="barcodeType">Type</label>
  <select id="barcodeType">
    <option value="EAN13">EAN-13</option>
    <option value="CODE128">CODE128</option>
    <option value="QR">QR Code</option>
  </select>

  <div class="row2">
    <div>
      <label for="barcodeWidth">Width (px)</label>
      <input type="number" id="barcodeWidth" value="300" min="180" max="2000"/>
    </div>
    <div>
      <label for="barcodeHeight">Height (px)</label>
      <input type="number" id="barcodeHeight" value="150" min="90" max="1000"/>
    </div>
  </div>

  <label>
    <input type="checkbox" id="useSelectedCell" checked/>
    Read value from selected cell
  </label>

  <div id="preview"><span>Preview will appear here</span></div>

  <button id="previewBtn">Preview</button>
  <button id="insertBtn">Insert into Excel</button>

  <div id="status"></div>

  <script src="taskpane.js"></script>
</body>
</html>
